<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procedimento de Emergência</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="min-h-screen bg-slate-100 py-8 px-4 flex justify-center items-center">

    <div class="w-full max-w-5xl bg-white rounded-xl shadow-lg border border-gray-200 p-6 md:p-10 space-y-6">

        <!-- 1. Cabeçalho / Título Principal -->
        <header class="w-full border-2 border-slate-700 bg-white py-5 px-4 text-center rounded-md shadow-sm">
            <h1 class="text-2xl md:text-3xl font-bold text-slate-800 tracking-wide">
                Procedimento de Emergência
            </h1>
        </header>

        <!-- 2. Área da Imagem Principal / Banner Destaque -->
        <section class="w-full bg-slate-200 border-2 border-slate-300 rounded-lg h-56 md:h-72 flex flex-col items-center justify-center text-slate-400 p-4 relative overflow-hidden transition-all duration-300">
            <div id="banner-content" class="flex flex-col items-center text-center">
                <!-- Ícone de Placeholder SVG estilo Wireframe -->
                <svg class="w-20 h-20 md:w-24 md:h-24 stroke-current opacity-60 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
                <span id="banner-title" class="text-slate-600 font-medium text-lg md:text-xl">
                    Banner de Sinalização de Segurança
                </span>
            </div>
        </section>

        <!-- 3. Botões de Categoria/Navegação -->
        <nav class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <button onclick="selectCategory('socorros')" id="btn-socorros" class="nav-btn bg-white border-2 border-slate-700 hover:bg-slate-800 hover:text-white text-slate-800 font-semibold py-3 px-4 rounded-md transition-all shadow-sm active:scale-95 text-center">
                Primeiros Socorros
            </button>
            <button onclick="selectCategory('incendio')" id="btn-incendio" class="nav-btn bg-white border-2 border-slate-700 hover:bg-slate-800 hover:text-white text-slate-800 font-semibold py-3 px-4 rounded-md transition-all shadow-sm active:scale-95 text-center">
                Incêndio
            </button>
            <button onclick="selectCategory('quimico')" id="btn-quimico" class="nav-btn bg-white border-2 border-slate-700 hover:bg-slate-800 hover:text-white text-slate-800 font-semibold py-3 px-4 rounded-md transition-all shadow-sm active:scale-95 text-center">
                Acidente Químico
            </button>
            <button onclick="selectCategory('queda')" id="btn-queda" class="nav-btn bg-white border-2 border-slate-700 hover:bg-slate-800 hover:text-white text-slate-800 font-semibold py-3 px-4 rounded-md transition-all shadow-sm active:scale-95 text-center">
                Queda de Altura
            </button>
        </nav>

        <!-- 4. Seção Inferior / Conteúdo de Emergência -->
        <main class="grid grid-cols-1 md:grid-cols-3 gap-6 pt-2">

            <!-- Coluna Esquerda: O QUE FAZER -->
            <div class="border-2 border-slate-700 rounded-lg p-5 flex flex-col justify-start bg-white min-h-[360px] shadow-sm">
                <h2 class="font-bold text-slate-800 text-center text-lg border-b-2 border-slate-200 pb-3 mb-4 uppercase tracking-wider">
                    LISTA DO QUE SE DEVE FAZER
                </h2>
                <ul id="lista-fazer" class="space-y-3 text-slate-700 text-sm md:text-base list-disc list-inside">
                    <!-- Conteúdo inserido via JS dinamicamente -->
                </ul>
            </div>

            <!-- Coluna Central: Imagem + Contatos Úteis -->
            <div class="flex flex-col space-y-6">
                <!-- Imagem/Ícone Central -->
                <div class="bg-slate-200 border-2 border-slate-300 rounded-lg h-44 flex items-center justify-center text-slate-400 p-2">
                    <svg class="w-16 h-16 stroke-current opacity-60" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                </div>

                <!-- Caixa com Telefones e Contatos Úteis -->
                <div class="border-2 border-slate-700 rounded-lg p-5 bg-white text-center flex flex-col justify-center shadow-sm flex-1">
                    <h3 class="font-bold text-slate-800 text-base mb-3 border-b border-slate-200 pb-2">CONTATOS DE EMERGÊNCIA</h3>
                    <div class="space-y-1.5 text-slate-700 font-semibold text-xs sm:text-sm md:text-base text-left mx-auto">
                        <p><span class="text-slate-900 font-bold">SAMU:</span> 192</p>
                        <p><span class="text-slate-900 font-bold">BOMBEIRO:</span> 193</p>
                        <p><span class="text-slate-900 font-bold">CEREST:</span> (19) 3404-6200</p>
                        <p><span class="text-slate-900 font-bold">CETESB:</span> 0800-0113560</p>
                        <p><span class="text-slate-900 font-bold">SESI SAUDE:</span> 0800-0551000</p>
                        <p><span class="text-slate-900 font-bold">POLICIA MILITAR:</span> 190</p>
                    </div>
                </div>
            </div>

            <!-- Coluna Direita: O QUE NÃO FAZER -->
            <div class="border-2 border-slate-700 rounded-lg p-5 flex flex-col justify-start bg-white min-h-[360px] shadow-sm">
                <h2 class="font-bold text-slate-800 text-center text-lg border-b-2 border-slate-200 pb-3 mb-4 uppercase tracking-wider">
                    LISTA DO QUE NÃO SE DEVE FAZER
                </h2>
                <ul id="lista-nao-fazer" class="space-y-3 text-slate-700 text-sm md:text-base list-disc list-inside">
                    <!-- Conteúdo inserido via JS dinamicamente -->
                </ul>
            </div>

        </main>
    </div>

    <script>
        // Dados para cada categoria de emergência
        const data = {
            socorros: {
                banner: "Primeiros Socorros - Manutenção e Atendimento Imediato",
                fazer: [
                    "Avaliar a segurança do local antes de aproximar",
                    "Chamar o SAMU (192) ou Bombeiros (193)",
                    "Verificar a respiração e pulso da vítima",
                    "Manter a vítima calma e aquecida",
                    "Aguardar socorro especializado"
                ],
                naoFazer: [
                    "NÃO mover a vítima sem necessidade",
                    "NÃO oferecer água ou alimentos",
                    "NÃO dar medicação por conta própria",
                    "NÃO retirar capacete em caso de motociclista",
                    "NÃO aplicar produtos caseiros em queimaduras"
                ]
            },
            incendio: {
                banner: "Procedimento de Emergência para Incêndios e Evacuação",
                fazer: [
                    "Acionar o alarme de incêndio imediatamente",
                    "Ligar para o Corpo de Bombeiros (193)",
                    "Utilizar as saídas de emergência sinalizadas",
                    "Caminhar abaixado em caso de fumaça densa",
                    "Dirigir-se ao Ponto de Encontro seguro"
                ],
                naoFazer: [
                    "NÃO utilizar elevadores durante o incêndio",
                    "NÃO retornar para buscar objetos pessoais",
                    "NÃO correr ou causar pânico na evacuação",
                    "NÃO abrir portas sem verificar se estão quentes",
                    "NÃO combater o fogo se não tiver treinamento"
                ]
            },
            quimico: {
                banner: "Procedimentos em Vazamentos e Acidentes Químicos",
                fazer: [
                    "Isolar e sinalizar a área contaminada",
                    "Consultar a FISPQ / FDS do produto",
                    "Ligar para a CETESB e emergência",
                    "Usar EPIs adequados para contenção",
                    "Lavar áreas atingidas com água corrente em abundância"
                ],
                naoFazer: [
                    "NÃO inalar vapores ou gases diretamente",
                    "NÃO tocar em substâncias desconhecidas",
                    "NÃO jogar água em reagentes incompatíveis",
                    "NÃO descartar resíduos na rede pública",
                    "NÃO permanecer contra o sentido do vento"
                ]
            },
            queda: {
                banner: "Atendimento a Vitimas de Queda de Altura",
                fazer: [
                    "Manter a vítima imóvel no local",
                    "Chamar resgate médico (192 ou 193) imediatamente",
                    "Controlar sangramentos externos visíveis",
                    "Estabilizar a cabeça e o pescoço à distância",
                    "Manter a calma e confortar a vítima"
                ],
                naoFazer: [
                    "NÃO mover ou virar a pessoa sob hipótese alguma",
                    "NÃO flexionar a coluna ou pescoço da vítima",
                    "NÃO massagear áreas com suspeita de fratura",
                    "NÃO permitir que a pessoa tente se levantar",
                    "NÃO puxar ou tracionar membros machucados"
                ]
            }
        };

        // Função para alternar entre as categorias ao clicar nos botões
        function selectCategory(catKey) {
            const currentData = data[catKey];

            // Atualiza Banner
            document.getElementById('banner-title').innerText = currentData.banner;

            // Atualiza Lista do que FAZER
            const listaFazer = document.getElementById('lista-fazer');
            listaFazer.innerHTML = currentData.fazer.map(item => `<li class="leading-relaxed"><span class="font-medium text-slate-800">${item}</span></li>`).join('');

            // Atualiza Lista do que NÃO FAZER
            const listaNaoFazer = document.getElementById('lista-nao-fazer');
            listaNaoFazer.innerHTML = currentData.naoFazer.map(item => `<li class="leading-relaxed"><span class="font-medium text-slate-800">${item}</span></li>`).join('');

            // Estilização de botões ativos
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('bg-slate-800', 'text-white');
                btn.classList.add('bg-white', 'text-slate-800');
            });

            const activeBtn = document.getElementById(`btn-${catKey}`);
            if (activeBtn) {
                activeBtn.classList.remove('bg-white', 'text-slate-800');
                activeBtn.classList.add('bg-slate-800', 'text-white');
            }
        }

        // Inicializar com Primeiros Socorros selecionado
        window.onload = function() {
            selectCategory('socorros');
        };
    </script>
</body>
</html>
